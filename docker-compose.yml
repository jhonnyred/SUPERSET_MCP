services:
  superset:
    build: ./superset
    container_name: superset
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    environment:
      SUPERSET_SECRET_KEY: "change_this_in_production"
      SUPERSET_LOAD_EXAMPLES: "false"
      SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
    command: >
      sh -c "superset db upgrade &&
             (superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true) &&
             superset init &&
             superset run -h 0.0.0.0 -p 8088 --with-threads"
    restart: unless-stopped

volumes:
  superset_home:
